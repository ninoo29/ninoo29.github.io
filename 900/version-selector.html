<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>صالة عمر نينو</title>
<style>
body{
margin:0;
background:url('luffy.jpg') center/cover no-repeat fixed;
color:white;
font-family:sans-serif;
}
.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding:20px;
}
.versions{
display:flex;
gap:20px;
justify-content:center;
margin-top:80px;
flex-wrap:wrap;
}
.card{
background:rgba(0,0,0,0.7);
border:2px solid #00aaff;
border-radius:15px;
padding:25px;
width:280px;
text-align:center;
cursor:pointer;
}
.card:hover{border-color:#ff3c00;transform:scale(1.05)}
.btn{
background:#ff3c00;
color:white;
padding:12px;
border:none;
border-radius:10px;
width:100%;
margin-top:15px;
font-size:18px;
cursor:pointer;
}
h1{text-align:center;text-shadow:2px 2px 4px #000}
</style>
</head>
<body>
<div class="overlay">
<h1>🏴‍☠️ صالة عمر نينو - PS4 9.00 🏴‍☠️</h1>
<div class="versions">
<div class="card" onclick="selectVersion('latest')">
<h2>GoldHEN Latest</h2>
<p>احدث نسخة - بيها كل المميزات الجديدة</p>
<button class="btn">[ SELECT ]</button>
</div>
<div class="card" onclick="selectVersion('stable')">
<h2>GoldHEN Stable</h2>
<p>نسخة مستقرة - للشغل اليومي بالصالة</p>
<button class="btn">[ SELECT ]</button>
</div>
</div>
</div>
<script>
function selectVersion(v){
localStorage.setItem('goldhen_version',v);
window.location.href='./index.html';
}
</script>
</body>
</html>
